<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackPlanner Coach Approval</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  color: #28a745;
}

.card {
  background: #222;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 10px;
}

.approve {
  background: #28a745;
  color: white;
}

.reject {
  background: #cc0000;
  color: white;
}

</style>
</head>

<body>

<h1>Coach Approval Panel</h1>

<div id="pendingList">
  Loading registrations...
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBCPLlr0tG2AWBrGTqkYrNwBZF0kKWMdBI",
  authDomain: "trackplanner-e192a.firebaseapp.com",
  projectId: "trackplanner-e192a",
  storageBucket: "trackplanner-e192a.firebasestorage.app",
  messagingSenderId: "23099407585",
  appId: "1:23099407585:web:399eb0053173ad646ccba0",
  measurementId: "G-SVSPE20ZGL"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

loadPendingUsers();

function loadPendingUsers() {

  db.collection("users")
    .where("approved", "==", false)
    .get()
    .then(snapshot => {

      const container =
        document.getElementById("pendingList");

      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML =
          "<p>No pending registrations.</p>";
        return;
      }

      snapshot.forEach(doc => {

        const user = doc.data();

        container.innerHTML += `
          <div class="card">

            <h3>${user.name}</h3>

            <p>
              <strong>Email:</strong>
              ${user.email}
            </p>

            <p>
              <strong>Role:</strong>
              ${user.role}
            </p>

            <p>
              <strong>Club:</strong>
              ${user.club || "-"}
            </p>

            <p>
              <strong>Group:</strong>
              ${user.group || "-"}
            </p>

            <button
              class="approve"
              onclick="approveUser('${doc.id}')">

              Approve

            </button>

            <button
              class="reject"
              onclick="rejectUser('${doc.id}')">

              Reject

            </button>

          </div>
        `;
      });

    });

}

function approveUser(uid) {

  db.collection("users")
    .doc(uid)
    .update({
      approved: true
    })
    .then(() => {

      alert("Athlete approved.");

      loadPendingUsers();

    });

}

function rejectUser(uid) {

  if (!confirm("Delete registration?")) {
    return;
  }

  db.collection("users")
    .doc(uid)
    .delete()
    .then(() => {

      alert("Registration removed.");

      loadPendingUsers();

    });

}

</script>

</body>
</html>
