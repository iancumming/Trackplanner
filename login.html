<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPlanner Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .header {
      padding: 40px 20px;
    }

    .tp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      height: 36px;
      margin-bottom: 20px;
    }

    .tp-badge img {
      width: 24px;
      height: auto;
    }

    .intro {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }

    .login-box {
      background: #222;
      padding: 30px;
      width: 300px;
      margin: 20px auto 60px;
      border-radius: 10px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    button {
      background: #007bff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #005fcc;
    }
  </style>
</head>

<body>

  <!-- TrackPlanner Header + Intro -->
  <div class="header">

    <div class="tp-badge">
      <img src="icons/tp.png" alt="TrackPlanner Logo">
      <span>TrackPlanner</span>
    </div>

    <p class="intro">
      Welcome to TrackPlanner.<br>
      A powerful, easy‑to‑use training planner for athletes and coaches to track and improve performance.<br>
      Log in to continue.
    </p>

  </div>

  <!-- Login Box -->
  <div class="login-box">
    <h2>TrackPlanner Login</h2>

    <input id="user" type="text" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBCPLlr0tG2AWBrGTqkYrNwBZF0kKWMdBI",
      authDomain: "trackplanner-e192a.firebaseapp.com",
      projectId: "trackplanner-e192a",
      storageBucket: "trackplanner-e192a.firebasestorage.app",
      messagingSenderId: "23099407585",
      appId: "1:23099407585:web:399eb0053173ad646ccba0",
      measurementId: "G-SVSPE20ZGL"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- Firebase Login Function -->
  <script>
    function login() {
      const email = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value.trim();

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          const uid = userCredential.user.uid;

          db.collection("users").doc(uid).get().then(doc => {
            if (!doc.exists) {
              alert("No user profile found in Firestore.");
              return;
            }

            const user = doc.data();

            localStorage.setItem("loggedIn", "yes");
            localStorage.setItem("role", user.role);
            localStorage.setItem("groupId", user.groupId || "");
            localStorage.setItem("athleteId", user.athleteId || "");

            if (user.role === "coach") {
              window.location.href = "coach.html";
            } else if (user.role === "athlete") {
              window.location.href = "athlete.html";
            } else {
              window.location.href = "individual.html";
            }
          });
        })
        .catch(err => {
          alert("Login failed: " + err.message);
        });
    }
  </script>

</body>
</html>
