<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .header {
      padding: 40px 20px;
    }

    .tp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      height: 36px;
      margin-bottom: 20px;
    }

    .tp-badge img {
      width: 24px;
      height: auto;
    }

    .intro {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }

    .login-box {
      background: #222;
      padding: 30px;
      width: 300px;
      margin: 20px auto 60px;
      border-radius: 10px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    button {
      background: #007bff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #005fcc;
    }
  </style>
</head>

<body>
<p style="color: yellow; font-size: 2rem;">LOGIN TEST MESSAGE</p>

  <!-- TrackPlanner Header + Intro -->
  <div class="header">

    <div class="tp-badge">
      <img src="icons/tp.png" alt="TrackPlanner Logo">
      <span>TrackPlanner</span>
    </div>

    <p class="intro">
      Welcome back to TrackPlanner.<br>
      Log in to access your athletes, sessions, drills, PBs, and season planning tools.
    </p>

  </div>

  <!-- Login Box -->
  <div class="login-box">
    <h2>TrackPlanner Login</h2>

    <input id="user" type="text" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>

  <script>
    function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;

      if (u === "DTFC-Endurance" && p === "trackplanner") {
        localStorage.setItem("loggedIn", "yes");
        window.location.href = "track.html";
      } else {
        alert("Incorrect login");
      }
    }
  </script>

</body>
</html>
