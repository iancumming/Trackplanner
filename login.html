<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackPlanner Login</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  margin: 0;
  padding: 0;
}

.header {
  padding: 40px 20px;
}

.tp-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #222;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 20px;
}

.tp-badge img {
  width: 24px;
}

.intro {
  max-width: 600px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

.login-box {
  background: #222;
  padding: 30px;
  width: 340px;
  margin: 20px auto;
  border-radius: 10px;
}

input,
select {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}

.login-btn {
  background: #007bff;
  color: white;
}

.login-btn:hover {
  background: #005fcc;
}

.create-btn {
  background: #28a745;
  color: white;
}

.create-btn:hover {
  background: #218838;
}

#registerPanel {
  display: none;
  margin-top: 20px;
  border-top: 1px solid #444;
  padding-top: 20px;
}

#clubFields {
  display: none;
}

</style>
</head>

<body>

<div class="header">

  <div class="tp-badge">
    <img src="icons/tp.png" alt="TrackPlanner Logo">
    <span>TrackPlanner</span>
  </div>

  <p class="intro">
    Welcome to TrackPlanner.<br>
    A powerful, easy-to-use training planner for athletes and coaches to track and improve performance.<br>
    Log in to continue.
  </p>

</div>
<!-- Login Box -->
<div class="login-box">

  <h2>TrackPlanner Login</h2>

  <input id="user" type="email" placeholder="Email">

  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">
    Login
  </button>

  <button
    onclick="showRegister()"
    style="background:#28a745;">

    Create Account

  </button>

  <!-- Hidden Registration Panel -->

  <div
    id="registerPanel"
    style="display:none; margin-top:20px;">

    <h3>Create Account</h3>

    <input
      id="regName"
      type="text"
      placeholder="Full Name">

    <select
      id="accountType"
      onchange="toggleClubFields()">

      <option value="individual">
        Individual Athlete
      </option>

      <option value="athlete">
        Club Athlete
      </option>

      <option value="coach">
        Coach
      </option>

    </select>

    <div id="clubFields" style="display:none;">

      <input
        id="clubName"
        type="text"
        placeholder="Club Name">

      <select id="groupName">

        <option value="">
          Select Training Group
        </option>

        <option value="Endurance">
          Endurance
        </option>

        <option value="Sprints">
          Sprints
        </option>

        <option value="Jumps">
          Jumps
        </option>

        <option value="Throws">
          Throws
        </option>

        <option value="Combined Events">
          Combined Events
        </option>

        <option value="Junior Development">
          Junior Development
        </option>

      </select>

    </div>

    <button
      onclick="createAccount()"
      style="background:#28a745;">

      Complete Registration

    </button>

  </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBCPLlr0tG2AWBrGTqkYrNwBZF0kKWMdBI",
  authDomain: "trackplanner-e192a.firebaseapp.com",
  projectId: "trackplanner-e192a",
  storageBucket: "trackplanner-e192a.firebasestorage.app",
  messagingSenderId: "23099407585",
  appId: "1:23099407585:web:399eb0053173ad646ccba0",
  measurementId: "G-SVSPE20ZGL"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function showRegister() {

  const panel =
    document.getElementById("registerPanel");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";
}

function toggleClubFields() {

  const accountType =
    document.getElementById("accountType").value;

  document.getElementById("clubFields").style.display =
    accountType === "individual"
      ? "none"
      : "block";
}

function login() {

  const email =
    document.getElementById("user").value.trim();

  const password =
    document.getElementById("pass").value.trim();

  auth.signInWithEmailAndPassword(email, password)

    .then(userCredential => {

      const uid = userCredential.user.uid;

      return db.collection("users")
        .doc(uid)
        .get();

    })

    .then(doc => {

      if (!doc.exists) {
        alert("No user profile found.");
        return;
      }

      const user = doc.data();

      localStorage.setItem("loggedIn", "yes");
      localStorage.setItem("role", user.role);
      localStorage.setItem("club", user.club || "");
      localStorage.setItem("group", user.group || "");
      localStorage.setItem("userName", user.name || "");

      window.location.href = "track.html";

    })

    .catch(error => {
      alert("Login failed: " + error.message);
    });

}

function createAccount() {

  const name =
    document.getElementById("regName").value.trim();

  const email =
    document.getElementById("user").value.trim();

  const password =
    document.getElementById("pass").value.trim();

  const accountType =
    document.getElementById("accountType").value;

  const club =
    document.getElementById("clubName").value.trim();

  const group =
    document.getElementById("groupName").value.trim();

  if (!name || !email || !password) {
    alert("Please complete all required fields.");
    return;
  }

  auth.createUserWithEmailAndPassword(email, password)

    .then(userCredential => {

      const uid = userCredential.user.uid;

      return db.collection("users")
        .doc(uid)
        .set({

          name: name,
          email: email,

          role: accountType,

          club: club,

          group: group,

          approved:
            accountType === "individual",

          created:
            new Date().toISOString()

        });

    })

    .then(() => {

      if (accountType === "individual") {

        alert(
          "Account created successfully."
        );

      } else {

        alert(
          "Registration submitted. Awaiting coach approval."
        );

      }

    })

    .catch(error => {
      alert(
        "Create account failed: " +
        error.message
      );
    });

}

</script>

</body>
</html>
