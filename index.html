

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackPlanner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .header {
      padding: 40px 20px;
    }

    /* Clean, small badge that fits the header */
    .tp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      height: 36px;
      margin-bottom: 20px;
    }

    .tp-badge img {
      width: 24px;
      height: auto;
    }

    .intro {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }

    .open-btn {
      background: #007bff;
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }

    .open-btn:hover {
      background: #005fcc;
    }

    .login-btn {
      background: #444;
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
    }

    .login-btn:hover {
      background: #333;
    }
  </style>
</head>

<body>


  <div class="header">

    <div class="tp-badge">
      <img src="icons/tp.png" alt="TrackPlanner Logo">
      <span>TrackPlanner</span>
    </div>

    <p class="intro">
      TrackPlanner is a simple, powerful training planner for athletes and coaches.
      View athletes, plan sessions, track drills, and manage your season — all in one place.
    </p>

    <a class="open-btn" href="track.html">Open TrackPlanner</a>
    <br>
    <a class="login-btn" href="login.html">Login</a>

  </div>

</body>
</html>
